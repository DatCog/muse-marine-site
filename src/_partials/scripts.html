<script>
  (function () {
    var menuBtn = document.getElementById('mobile-menu-btn');
    var mobileMenu = document.getElementById('mobile-menu');
    if (menuBtn && mobileMenu) {
      menuBtn.addEventListener('click', function () {
        var isHidden = mobileMenu.classList.toggle('hidden');
        menuBtn.setAttribute('aria-expanded', String(!isHidden));
      });
    }

    var observer = new IntersectionObserver(function (entries) {
      entries.forEach(function (entry) {
        if (entry.isIntersecting) entry.target.classList.add('visible');
      });
    }, { threshold: 0.1 });
    document.querySelectorAll('.fade-in').forEach(function (el) { observer.observe(el); });

    var backToTopBtn = document.getElementById('back-to-top');
    if (backToTopBtn) {
      window.addEventListener('scroll', function () {
        if (window.scrollY > 300) {
          backToTopBtn.classList.remove('opacity-0', 'translate-y-10');
          backToTopBtn.classList.add('opacity-100', 'translate-y-0');
        } else {
          backToTopBtn.classList.add('opacity-0', 'translate-y-10');
          backToTopBtn.classList.remove('opacity-100', 'translate-y-0');
        }
      });
      backToTopBtn.addEventListener('click', function () {
        window.scrollTo({ top: 0, behavior: 'smooth' });
      });
    }

    // Highlight the active product category in the nav dropdown / mobile menu
    var category = new URLSearchParams(window.location.search).get('category');
    if (category) {
      document.querySelectorAll('[data-cat-link]').forEach(function (link) {
        if (link.getAttribute('data-cat-link') === category) {
          link.classList.add('text-appleBlue', 'font-semibold');
          if (link.closest('details')) {
            link.classList.add('bg-blue-50');
          }
        }
      });
    }
  })();
</script>

<script>
  window.SITE_CONFIG = { formEndpoint: '{{FORM_ENDPOINT}}', web3formsKey: '{{WEB3FORMS_KEY}}', salesEmail: '{{SALES_EMAIL}}' };

  function buildFormBody(form) {
    var parts = [];
    form.querySelectorAll('input[name], textarea[name]').forEach(function (el) {
      if (el.value && el.value.trim()) parts.push(el.name + ': ' + el.value.trim());
    });
    return parts.join('\n');
  }

  function showFormToast(message, isError) {
    var toast = document.getElementById('form-toast');
    if (!toast) return;
    var msg = toast.querySelector('[data-msg]');
    var icon = toast.querySelector('[data-icon]');
    if (msg) msg.textContent = message;
    if (icon) {
      icon.classList.toggle('text-emerald-600', !isError);
      icon.classList.toggle('text-red-500', !!isError);
    }
    toast.classList.remove('opacity-0', 'translate-y-[-20px]', 'pointer-events-none');
    toast.classList.add('opacity-100', 'translate-y-0');
    setTimeout(function () {
      toast.classList.add('opacity-0', 'translate-y-[-20px]', 'pointer-events-none');
      toast.classList.remove('opacity-100', 'translate-y-0');
    }, 4500);
  }

  document.querySelectorAll('form[data-form]').forEach(function (form) {
    form.addEventListener('submit', function (e) {
      e.preventDefault();
      if (!form.checkValidity()) { form.reportValidity(); return; }
      var cfg = window.SITE_CONFIG || {};
      var data = new FormData(form);
      if (cfg.formEndpoint) {
        if (cfg.web3formsKey) data.append('access_key', cfg.web3formsKey);
        fetch(cfg.formEndpoint, { method: 'POST', body: data, headers: { 'Accept': 'application/json' } })
          .then(function (res) {
            if (!res.ok) throw new Error('HTTP ' + res.status);
            return res.json();
          })
          .then(function (json) {
            if (json && json.success) {
              showFormToast('Thank you! Your request has been submitted.', false);
              form.reset();
            } else {
              throw new Error((json && json.message) || 'Submission failed');
            }
          })
          .catch(function () {
            showFormToast('Something went wrong. Please email ' + cfg.salesEmail + '.', true);
          });
      } else {
        var email = (form.querySelector('[name=email]') || {}).value || '';
        var subject = 'MUSE MARINE inquiry' + (email ? ' from ' + email : '');
        var mailto = 'mailto:' + cfg.salesEmail + '?subject=' + encodeURIComponent(subject) + '&body=' + encodeURIComponent(buildFormBody(form));
        showFormToast('Opening your email client to send the inquiry...', false);
        window.location.href = mailto;
        form.reset();
      }
    });
  });
</script>
</body>
</html>
